# YDLidar TG params for the NAMESPACED Rosmaster stack (/rosmaster).
# Copy of the vendor library_ws ydlidar.yaml (TG values) with the node key
# wildcarded so it matches /rosmaster/ydlidar_ros2_driver_node. Vendor file
# left untouched — it is copy-installed and any edit would be lost on
# library_ws rebuild. master.launch.py defaults ydlidar_params to THIS file.
/**/ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser
    ignore_array: ""
    baudrate: 512000
    lidar_type: 0
    device_type: 0
    sample_rate: 20
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: false
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 50.0
    range_min: 0.01
    frequency: 10.0
    invalid_range_is_inf: false
